<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Details</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header><h1 class="title">Classroom</h1></header>
    
    <div class="section">
        <h2 class="section-title">Teacher Information</h2>
        <p class="teacher">Bala Mugund</p>
        <p class="teacher">Mern</p>
    </div>

    <div class="section">
        <h2 class="section-title">Student Information</h2>
        <p class="student">Dinesh</p>
        <p class="student">Sarjith</p>
        <p class="student">Kumar</p>
        <p class="student">Divya</p>
    </div>

    <div class="section">
        <h2 class="section-title">Today's Topics</h2>
        <p class="topic">HTML</p>
        <p class="topic">CSS</p>
        <p class="topic">JavaScript</p>
    </div>

    <div class="section">
        <h2 class="section-title">Class Status</h2>
        <label for="status">Select The Status</label>
        <select name="status" id="status">
            <option value="">--Select an option</option>
            <option value="Started">Class Started</option>
            <option value="Inprogress">Class In Progress</option>
            <option value="Completed">Class Completed</option>
        </select>
    </div>

</body>
</html>
