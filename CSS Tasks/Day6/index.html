<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position & Flexbox Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>CSS Practice</h1>

    <nav>
        <a href="#task1">Task 1</a>
        <a href="#task2">Task 2</a>
        <a href="#task3">Task 3</a>
    </nav>
</header>

<main>
    <article class="task" id="task1">
        <h1>Task 1 - CSS Position Practice</h1>

        <section class="inner">
            <div class="position-parent">

                <div class="position-child top-right">
                    Top Right
                </div>

                <div class="position-child center-box">
                    Center
                </div>

                <div class="position-child bottom-left">
                    Bottom Left
                </div>

            </div>
        </section>
    </article>


    <article class="task" id="task2">
        <h1>Task 2 - Z-Index Practice</h1>

        <section class="inner">
            <div class="z-index-parent">

                <div class="z-box z-box1">
                    Box 1<br>
                    z-index: 1
                </div>

                <div class="z-box z-box2">
                    Box 2<br>
                    z-index: 2
                </div>

                <div class="z-box z-box3">
                    Box 3<br>
                    z-index: 3
                </div>

            </div>
        </section>
    </article>


    <article class="task" id="task3">
        <h1>Task 3 - Course Cards Flexbox</h1>

        <section class="inner">

            <div class="course-container">

                <div class="course-card html">HTML</div>
                <div class="course-card css">CSS</div>
                <div class="course-card javascript">JavaScript</div>
                <div class="course-card bootstrap">Bootstrap</div>
                <div class="course-card tailwind">Tailwind CSS</div>
                <div class="course-card react">React JS</div>
                <div class="course-card node">Node JS</div>
                <div class="course-card mongodb">MongoDB</div>

            </div>

        </section>
    </article>

</main>

</body>
</html>
