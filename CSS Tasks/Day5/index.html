<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display properties</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header>
        <h1>
            Display properties
        </h1>
        <nav>
            <a href="#task1">Task1</a>
            <a href="#task2">Task2</a>
            <a href="#task3">Task3</a>
        </nav>
    </header>
    <main>
        <article class="task" id="task1">
            <h1>Task 1 - Flex direction </h1>
            <section class="inner">
                <div class="container">
                    
                    <div class="bord">
                        <h3>Flex direction - Column</h3>
                        <div id="col">
                        <div class="card" id="html"></div>
                        <div class="card" id="css"></div>
                        <div class="card" id="js"></div>
                        <div class="card" id="react"></div>
                        <div class="card" id="node"></div>
                        </div>
                    </div>
                    <div class="sub bord">
                        <div class>
                            <h3>Flex direction - Row</h3>
                            <div id="row">
                            <div class="card" id="html"></div>
                            <div class="card" id="css"></div>
                            <div class="card" id="js"></div>
                            <div class="card" id="react"></div>
                            <div class="card" id="node"></div>
                            </div>
                        </div>
                        <div class>
                            <h3>Flex direction - Row Reverse</h3>
                            <div id="row_rev">
                            <div class="card" id="html"></div>
                            <div class="card" id="css"></div>
                            <div class="card" id="js"></div>
                            <div class="card" id="react"></div>
                            <div class="card" id="node"></div>
                            </div>
                        </div>
                    </div>
                    <div class="bord">
                        <h3>Flex direction - Column reverse</h3>
                        <div id="col_rev">
                        <div class="card" id="html"></div>
                        <div class="card" id="css"></div>
                        <div class="card" id="js"></div>
                        <div class="card" id="react"></div>
                        <div class="card" id="node"></div>
                        </div>
                    </div>
                </div>

            </section>
        </article>

        <article class="task" id="task2">
            <h1>Task 2 -Align items and Justify Content</h1>
            <section class="inner">
                <div class="parent_box">
                    <div class="card">Box1</div>
                    <div class="card">Box2</div>
                    <div class="card">Box3</div>
                    <div class="card" id="box">Box4</div>
                </div>
            </section>
        </article>
        <section class="task" id="task3">
            <h1>Task 3 - Flex Wrap</h1>
            <article class="inner" id="fix">
                <div id="wrapper">
                    <div class="card" id="html"></div>
                    <div class="card" id="css"></div>
                    <div class="card" id="js"></div>
                    <div class="card" id="react"></div>
                    <div class="card" id="node"></div>
                    <div class="card" id="db"></div>
                    </div>
            </article>
        </section>

    </main>
</body>
</html>
