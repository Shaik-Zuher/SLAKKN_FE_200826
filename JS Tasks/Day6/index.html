<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Loops</title>

        <link rel="stylesheet" href="../assets/styles.css">
    </head>

    <body>

        <header class="main-header">
        <h1>Loops</h1>

        <nav>
            <a href="#task1">Task</a>
        </nav>
        </header>
        <section class="task" id="task1">
            <h1 style="text-align: center;">Check the Console or hit "CTRL+SHIFT+J"</a></h1>
        </section>
        <script>
           // TASK 1
            let ans=[];
            for(var i=1;i<11;i++){
                ans.push((i*5).toString());
            }
            console.log(ans.join(" "));
            // TASK 2
            ans=[]
            for(var i=1;i<=10;i++){
                ans.push((i*2).toString());
            }
            console.log(ans.join(" "));
            // TASK 3
            let s=0;
            ans=[];
            for(var i=1;i<=20;i++){
                ans.push(i);
                s+=i;
            }
            console.log(ans.join("+")+"="+s);
            // TASK 4
            for(var i=1;i<11;i++){
                console.log(i*i);
            }

            // TASK 5
            var i=50;
            while(i>=0){
                console.log(i);
                i-=5;
            }
        </script>
    </body>
</html>
