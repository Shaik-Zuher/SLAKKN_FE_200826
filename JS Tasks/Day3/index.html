<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>JS Data Types & Operators</title>

        <link rel="stylesheet" href="../assets/styles.css">
    </head>

    <body>

        <header class="main-header">
        <h1>JS DataTypes and Operators</h1>

        <nav>
            <a href="#task1">Task</a>
        </nav>
        </header>
        <section class="task" id="task1">
            <h1 style="text-align: center;">Check the Console</h1>
        </section>
        <script>
           //Task1
           let Shirt_Price=1200;
           let quantity=3;
           let deliveryCharge=100;
           let total=Shirt_Price*quantity;
           let bill=total+deliveryCharge
           console.log("Task1 : Total and Final Bill are",total,"and",bill);
            //task2
            let salary=30000;
            let bonus=5000;
            let Final=salary+bonus;
            Final-=2000;
            console.log("Task2 : Final Salary is",Final);
            //Task3
            var Starting= 20000;
            var Deposit = 5000;
            var Withdrawal = 3000;
            total=Starting+Deposit;
            total-=Withdrawal;
            console.log("Task3 : Bank Account Balance",total);
            //Task4
            var Tamil = 80;
            var English = 75;
            var Maths = 90;
            var Science = 85;
            var Computer = 95;
            total=Tamil+English+Maths+Science+Computer;
            console.log(`Task4 : Student Marks-- Total:${total} , Average:${total/5}`);
            //Task5
            let number=20;
            number+=10;
            number*=10;
            number-=20;
            number/=4;
            number%=3;
            console.log("Task5 : Final Value",number);

        </script>
    </body>
</html>
