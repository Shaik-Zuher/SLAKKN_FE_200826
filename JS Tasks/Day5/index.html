<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>For And While loop</title>

        <link rel="stylesheet" href="../assets/styles.css">
    </head>

    <body>

        <header class="main-header">
        <h1>For And While Loop</h1>

        <nav>
            <a href="#task1">Task</a>
        </nav>
        </header>
        <section class="task" id="task1">
            <h1 style="text-align: center;">Check the Console</h1>
        </section>
        <script>
           // TASK 1
            let a = 20;
            let b = 10;
            console.log("Task1")
            console.log("Addition =", a + b);
            console.log("Subtraction =", a - b);
            console.log("Multiplication =", a * b);
            console.log("Division =", a / b);
            console.log("Remainder =", a % b);


            // TASK 2
            let number = 15;
                        console.log("Task2")

            if (number % 2 === 0) {
                console.log("Even");
            } else {
                console.log("Odd");
            }


            // TASK 3
            let num = -5;
            console.log("Task3")

            if (num > 0) {
                console.log("Positive");
            } else if (num < 0) {
                console.log("Negative");
            } else {
                console.log("Zero");
            }


            // TASK 4
            let age = 20;
            console.log("Task4")

            if (age >= 18) {
                console.log("Eligible to Vote");
            } else {
                console.log("Not Eligible to Vote");
            }


            // TASK 5
            a = 40;
            b = 25;
            console.log("Task5")

            if (a > b) {
                console.log(a + " is Largest");
            } else {
                console.log(b + " is Largest");
            }


            // TASK 6
            let mark = 78;
            console.log("Task6")

            if (mark >= 90) {
                console.log("Grade A");
            } else if (mark >= 75) {
                console.log("Grade B");
            } else if (mark >= 50) {
                console.log("Grade C");
            } else {
                console.log("Fail");
            }


            // TASK 7
            console.log("Task7")

            for (let i = 1; i <= 20; i++) {
                console.log(i);
            }


            // TASK 8
            console.log("Task8")

            for (let i = 1; i <= 50; i++) {
                if (i % 2 === 0) {
                    console.log(i);
                }
            }


            // TASK 9
            number = 5;
            console.log("Task9")

            for (let i = 1; i <= 10; i++) {
                console.log(number + " x " + i + " = " + (number * i));
            }


            // TASK 10
            let total = 0;
            console.log("Task10")

            for (let i = 1; i <= 10; i++) {
                total = total + i;
            }

            console.log("Total =", total);
        </script>
    </body>
</html>
