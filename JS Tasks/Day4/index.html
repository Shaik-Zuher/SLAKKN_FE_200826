<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Condition - Control</title>

        <link rel="stylesheet" href="../assets/styles.css">
    </head>

    <body>

        <header class="main-header">
        <h1>Condition Control</h1>

        <nav>
            <a href="#task1">Task</a>
        </nav>
        </header>
        <section class="task" id="task1">
            <h1 style="text-align: center;">Check the Console</h1>
        </section>
        <script>
           // Task 1 – Positive Number
            let number = 10;

            if (number > 0) {
                console.log("Positive Number");
            }


            // Task 2 – Voting Eligibility
            let age = 20;

            if (age >= 18) {
                console.log("Eligible to Vote");
            } else {
                console.log("Not Eligible to Vote");
            }


            // Task 3 – Student Grade
            let mark = 75;

            if (mark >= 90) {
                console.log("Grade A");
            } else if (mark >= 60) {
                console.log("Grade B");
            } else {
                console.log("Grade C");
            }


            // Task 4 – Print 1 to 10
            for (let i = 1; i <= 10; i++) {
                console.log(i);
            }


            // Task 5 – Print Even Numbers
            for (let i = 1; i <= 20; i++) {
                if (i % 2 === 0) {
                    console.log(i);
                }
            }
        </script>
    </body>
</html>
